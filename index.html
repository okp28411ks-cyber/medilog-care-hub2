<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medilog Care Hub - 総合健康・服薬管理</title>

  <!-- Lucide Icons & Supabase JS SDK -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- CSS読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー (すべての画面で固定表示) -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="brand-icon-wrapper">
        <i data-lucide="heart-pulse"></i>
      </div>
      <span>Medilog Care Hub</span>
    </div>
    
    <div class="auth-status flex gap-2">
      <button id="auth-btn" onclick="toggleModal('auth-modal')" class="btn btn-primary">
        <i data-lucide="user"></i> ログイン / 登録
      </button>
      <button id="logout-btn" onclick="handleLogout()" class="btn btn-secondary hidden">
        ログアウト
      </button>
    </div>
  </header>

  <div class="app-container flex">

    <!-- サイドバーナビゲーション (デスクトップ向け) -->
    <nav class="sidebar-nav hidden md-flex">
      <button onclick="switchTab('dashboard')" class="nav-btn active" id="nav-dashboard">
        <i data-lucide="layout-dashboard"></i> <span>ダッシュボード</span>
      </button>
      <button onclick="switchTab('daily-log')" class="nav-btn" id="nav-daily-log">
        <i data-lucide="activity"></i> <span>体調管理 (毎日)</span>
      </button>
      <button onclick="switchTab('medicine-stock')" class="nav-btn" id="nav-medicine-stock">
        <i data-lucide="pill"></i> <span>おくすり在庫</span>
      </button>
      <button onclick="switchTab('dose-log')" class="nav-btn" id="nav-dose-log">
        <i data-lucide="check-square"></i> <span>服薬記録</span>
      </button>
      <button onclick="switchTab('hospital-visit')" class="nav-btn" id="nav-hospital-visit">
        <i data-lucide="calendar"></i> <span>通院予定</span>
      </button>
      <button onclick="switchTab('stats')" class="nav-btn" id="nav-stats">
        <i data-lucide="bar-chart-3"></i> <span>統計・分析</span>
      </button>
      <button onclick="switchTab('friends')" class="nav-btn" id="nav-friends">
        <i data-lucide="users"></i> <span>フレンド・DM</span>
      </button>
      <button onclick="switchTab('personal-record')" class="nav-btn" id="nav-personal-record">
        <i data-lucide="file-text"></i> <span>基本情報・自身記録</span>
      </button>
    </nav>

    <!-- メイン表示領域 -->
    <main class="main-content flex-1 p-6">

      <!-- ================= 1. ダッシュボード ================= -->
      <section id="tab-dashboard" class="tab-page">
        <div class="glass-card p-6 mb-6">
          <h1 class="text-2xl font-bold mb-1" id="user-greeting">おかえりなさい</h1>
          <p class="text-muted">本日の健康状態・服薬リマインダー・アラームを確認しましょう。</p>
        </div>

        <div class="grid-2 gap-4 mb-6">
          <!-- 服薬アラーム・タイミング案内 -->
          <div class="card-elevated p-5">
            <h3 class="font-bold flex items-center gap-2 mb-3"><i data-lucide="bell" class="text-teal"></i> 本日の服薬アラーム</h3>
            <div id="today-alarms-list" class="space-y-2 text-sm text-secondary">
              <!-- JSで動的生成 -->
              <p class="text-muted">本日の服薬スケジュールはありません。</p>
            </div>
            <button onclick="toggleModal('dose-alarm-modal')" class="btn btn-secondary w-full mt-4">+ 服薬アラーム設定</button>
          </div>

          <!-- 通知・リマインダーリスト -->
          <div class="card-elevated p-5">
            <h3 class="font-bold flex items-center gap-2 mb-3"><i data-lucide="alert-triangle" class="text-amber"></i> 通知・リマインダー</h3>
            <ul id="notifications-list" class="space-y-2 text-sm">
              <li class="badge badge-amber w-full p-2 block">体調管理記録が本日未入力です (1日3回推奨)</li>
            </ul>
          </div>
        </div>
      </section>

      <!-- ================= 2. 体調管理 (毎日入力) ================= -->
      <section id="tab-daily-log" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">体調管理 (日次記録)</h2>
        <form id="form-daily-log" onsubmit="saveDailyLog(event)" class="glass-card p-6 space-y-4">
          <div>
            <label class="form-label">血圧記録</label>
            <div class="grid-3 gap-2">
              <input type="text" id="daily-bp-morning" placeholder="朝 (例: 120/80)" class="form-input">
              <input type="text" id="daily-bp-noon" placeholder="昼" class="form-input">
              <input type="text" id="daily-bp-night" placeholder="夜" class="form-input">
            </div>
          </div>

          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">起床時刻</label>
              <input type="time" id="daily-wake-time" class="form-input">
            </div>
            <div>
              <label class="form-label">就寝時刻</label>
              <input type="time" id="daily-sleep-time" class="form-input">
            </div>
          </div>

          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">飲酒記録</label>
              <select id="daily-alcohol" class="form-select">
                <option value="なし">なし</option>
                <option value="少量">少量 (缶ビール1本程度)</option>
                <option value="多め">多め</option>
              </select>
            </div>
            <div>
              <label class="form-label">喫煙記録</label>
              <select id="daily-smoking" class="form-select">
                <option value="なし">なし</option>
                <option value="あり">あり</option>
              </select>
            </div>
          </div>

          <div>
            <label class="form-label">こころの状態 / プチ日記</label>
            <textarea id="daily-diary" placeholder="今日の気分や体調の変化を書き残しましょう" class="form-textarea"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-full">体調記録を保存</button>
        </form>
      </section>

      <!-- ================= 3. おくすり在庫 ================= -->
      <section id="tab-medicine-stock" class="tab-page hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">おくすり在庫一覧</h2>
          <button onclick="toggleModal('medicine-modal')" class="btn btn-primary">+ おくすりを登録</button>
        </div>

        <div id="medicine-cards-grid" class="grid-2 gap-4">
          <!-- JSで在庫カード一覧を動的レンダリング -->
        </div>
      </section>

      <!-- ================= 4. 服薬記録 ================= -->
      <section id="tab-dose-log" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">服薬の記録</h2>
        <form id="form-dose-log" onsubmit="saveDoseLog(event)" class="glass-card p-6 space-y-4 mb-6">
          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">おくすり選択 (在庫より)</label>
              <select id="dose-medicine-select" class="form-select" required></select>
            </div>
            <div>
              <label class="form-label">服用量</label>
              <input type="text" id="dose-amount" placeholder="例: 1錠" class="form-input" required>
            </div>
          </div>

          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">日時</label>
              <input type="datetime-local" id="dose-datetime" class="form-input" required>
            </div>
            <div>
              <label class="form-label">タイミング</label>
              <select id="dose-timing" class="form-select">
                <option value="朝">朝</option>
                <option value="昼">昼</option>
                <option value="夕">夕</option>
                <option value="寝る前">寝る前</option>
                <option value="頓服">頓服・その他</option>
              </select>
            </div>
          </div>

          <div>
            <label class="form-label">メモ</label>
            <input type="text" id="dose-notes" placeholder="食後、頭痛時に服用 など" class="form-input">
          </div>

          <button type="submit" class="btn btn-primary w-full">服用を記録（在庫数を自動消費）</button>
        </form>
      </section>

      <!-- ================= 5. 通院日記録 ================= -->
      <section id="tab-hospital-visit" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">通院日の予約・予定入力</h2>
        <form id="form-hospital-visit" onsubmit="saveHospitalVisit(event)" class="glass-card p-6 space-y-4">
          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">日時</label>
              <input type="datetime-local" id="visit-datetime" class="form-input" required>
            </div>
            <div>
              <label class="form-label">病院名</label>
              <input type="text" id="visit-hospital-name" placeholder="○○クリニック" class="form-input" required>
            </div>
          </div>

          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">診療科</label>
              <input type="text" id="visit-department" placeholder="内科・皮膚科など" class="form-input">
            </div>
          </div>

          <div>
            <label class="form-label">主治医への伝達メモ</label>
            <textarea id="visit-doctor-notes" placeholder="質問したいこと・直近の副作用など" class="form-textarea"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-full">通院予定を登録</button>
        </form>
      </section>

      <!-- ================= 6. 統計・分析 ================= -->
      <section id="tab-stats" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">服薬・在庫の統計情報</h2>
        <div class="grid-2 gap-4">
          <div class="card-elevated p-5">
            <h3 class="font-bold mb-2">直近の服用回数</h3>
            <select id="stats-range-select" class="form-select mb-4">
              <option value="1day">1日</option>
              <option value="1week">1週間</option>
              <option value="2weeks">2週間</option>
              <option value="1month">1か月</option>
            </select>
            <div class="text-3xl font-bold text-teal" id="stats-dose-count">0 次</div>
          </div>

          <div class="card-elevated p-5">
            <h3 class="font-bold mb-2">在庫が少ないおくすり</h3>
            <ul id="low-stock-list" class="space-y-2 text-sm text-rose">
              <!-- 動的リスト -->
            </ul>
          </div>
        </div>
      </section>

      <!-- ================= 7. フレンド機能 & DM ================= -->
      <section id="tab-friends" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">フレンド共有 & ダイレクトメッセージ</h2>
        <div class="grid-2 gap-4">
          <div class="glass-card p-5">
            <h3 class="font-bold mb-3">ユーザー検索・申請</h3>
            <div class="flex gap-2">
              <input type="text" id="friend-search-username" placeholder="ユーザーネームで検索" class="form-input">
              <button onclick="searchAndApplyFriend()" class="btn btn-primary">申請</button>
            </div>
          </div>

          <div class="glass-card p-5">
            <h3 class="font-bold mb-3">フレンド一覧</h3>
            <div id="friends-list" class="space-y-2 text-sm"></div>
          </div>
        </div>
      </section>

      <!-- ================= 8. 基本情報・自身記録 ================= -->
      <section id="tab-personal-record" class="tab-page hidden">
        <h2 class="text-xl font-bold mb-4">基本情報・カルテ設定</h2>
        <form id="form-personal-profile" onsubmit="saveProfile(event)" class="glass-card p-6 space-y-4">
          <div class="grid-2 gap-4">
            <div>
              <label class="form-label">ユーザー名</label>
              <input type="text" id="profile-username" class="form-input">
            </div>
            <div>
              <label class="form-label">性別</label>
              <select id="profile-gender" class="form-select">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div class="grid-3 gap-2">
            <div>
              <label class="form-label">年齢</label>
              <input type="number" id="profile-age" class="form-input">
            </div>
            <div>
              <label class="form-label">身長 (cm)</label>
              <input type="number" step="0.1" id="profile-height" class="form-input">
            </div>
            <div>
              <label class="form-label">体重 (kg)</label>
              <input type="number" step="0.1" id="profile-weight" class="form-input">
            </div>
          </div>

          <div>
            <label class="form-label">アレルギー</label>
            <input type="text" id="profile-allergies" placeholder="例: ペニシリン、卵" class="form-input">
          </div>

          <div>
            <label class="form-label">持っている病名（既往歴）</label>
            <textarea id="profile-conditions" class="form-textarea"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-full">基本情報を更新</button>
        </form>
      </section>

    </main>
  </div>

  <!-- モバイル用 ボトムナビゲーション -->
  <nav class="mobile-nav md-hidden">
    <button onclick="switchTab('dashboard')" class="mobile-nav-btn active"><i data-lucide="layout-dashboard"></i><span>ホーム</span></button>
    <button onclick="switchTab('daily-log')" class="mobile-nav-btn"><i data-lucide="activity"></i><span>体調</span></button>
    <button onclick="switchTab('medicine-stock')" class="mobile-nav-btn"><i data-lucide="pill"></i><span>おくすり</span></button>
    <button onclick="switchTab('friends')" class="mobile-nav-btn"><i data-lucide="users"></i><span>フレンド</span></button>
  </nav>

  <!-- ================= モーダル群 ================= -->

  <!-- 会員登録 / ログイン モーダル -->
  <div id="auth-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h3 class="text-xl font-bold mb-4">会員登録 / ログイン</h3>
      <form id="form-auth" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="form-label">メールアドレス</label>
          <input type="email" id="auth-email" class="form-input" required>
        </div>
        <div>
          <label class="form-label">パスワード</label>
          <input type="password" id="auth-password" class="form-input" required>
        </div>
        <div class="flex gap-2 pt-3">
          <button type="submit" class="btn btn-primary flex-1">ログイン / 登録</button>
          <button type="button" onclick="toggleModal('auth-modal')" class="btn btn-secondary">閉じる</button>
        </div>
      </form>
    </div>
  </div>

  <!-- おくすり追加・編集 モーダル -->
  <div id="medicine-modal" class="modal-backdrop hidden">
    <div class="modal-content max-w-lg">
      <h3 class="text-xl font-bold mb-4">おくすり登録</h3>
      <form id="form-medicine-add" onsubmit="saveMedicine(event)" class="space-y-3">
        <div class="grid-2 gap-2">
          <div>
            <label class="form-label">おくすりの名前</label>
            <input type="text" id="med-name" class="form-input" required>
          </div>
          <div>
            <label class="form-label">写真URL/ファイル</label>
            <input type="text" id="med-photo-url" placeholder="画像URL" class="form-input">
          </div>
        </div>

        <div class="grid-2 gap-2">
          <div>
            <label class="form-label">含有量 (mg)</label>
            <input type="number" id="med-dosage-mg" class="form-input">
          </div>
          <div>
            <label class="form-label">製薬会社</label>
            <input type="text" id="med-pharmaceutical-co" class="form-input">
          </div>
        </div>

        <div class="grid-2 gap-2">
          <div>
            <label class="form-label">薬種類</label>
            <input type="text" id="med-category" placeholder="解熱鎮痛剤 など" class="form-input">
          </div>
          <div>
            <label class="form-label">分類</label>
            <select id="med-classification" class="form-select">
              <option value="処方">処方</option>
              <option value="市販">市販</option>
              <option value="個人輸入">個人輸入</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>

        <div class="grid-2 gap-2">
          <div>
            <label class="form-label">現在の在庫数</label>
            <input type="number" id="med-stock-count" class="form-input" value="0">
          </div>
          <div>
            <label class="form-label">使用期限</label>
            <input type="date" id="med-expiration-date" class="form-input">
          </div>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="submit" class="btn btn-primary flex-1">登録保存</button>
          <button type="button" onclick="toggleModal('medicine-modal')" class="btn btn-secondary">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript読み込み -->
  <script src="app.js"></script>
</body>
</html>
