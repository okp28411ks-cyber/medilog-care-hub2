<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medilog Care Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold text-2xl shadow-lg shadow-blue-200">＋</div>
        <h1 class="text-2xl font-bold text-slate-800">Medilog Care Hub</h1>
        <p class="text-slate-500 text-sm mt-1">ヘルスケア＆お薬管理ポータル</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">メールアドレス</label>
          <input type="email" id="email" required placeholder="user@example.com" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">パスワード</label>
          <input type="password" id="password" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="handleSignUp()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">新規登録</button>
          <button type="button" onclick="handleSignIn()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-blue-200 transition text-sm">ログイン</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-screen" class="hidden flex-col md:flex-row min-h-screen">
    <aside class="w-full md:w-64 bg-white border-r border-slate-200 p-4 flex flex-col justify-between">
      <div>
        <div class="flex items-center space-x-3 mb-8 px-2">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-100">＋</div>
          <div>
            <h1 class="font-bold text-slate-800 leading-none">Medilog</h1>
            <span class="text-xs text-blue-600 font-semibold">Care Hub</span>
          </div>
        </div>
        <nav class="space-y-1" id="nav-list">
          <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm text-blue-600 bg-blue-50">
            <i data-lucide="activity" class="w-5 h-5"></i><span>ダッシュボード</span>
          </button>
          <button onclick="switchTab('inventory')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-50">
            <i data-lucide="pill" class="w-5 h-5"></i><span>おくすり在庫</span>
          </button>
          <button onclick="switchTab('condition')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-50">
            <i data-lucide="calendar" class="w-5 h-5"></i><span>体調管理</span>
          </button>
        </nav>
      </div>
      <button onclick="handleSignOut()" class="mt-6 w-full text-left p-3 bg-slate-50 hover:bg-rose-50 text-rose-600 rounded-xl text-xs font-bold transition flex items-center justify-between">
        <span>ログアウト</span>
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </aside>

    <main class="flex-1 p-4 md:p-8 max-w-5xl w-full">
      
      <section id="view-dashboard" class="space-y-6">
        <h2 class="text-xl font-bold">ダッシュボード</h2>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-5 shadow-lg">
            <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">次回通院日</span>
            <div class="text-2xl font-bold mt-2">2026年3月15日 10:00</div>
            <p class="text-xs text-blue-100 mt-1">中央市民病院 (内科)</p>
          </div>
          <div class="bg-white border rounded-2xl p-5 shadow-sm">
            <span class="text-xs font-bold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-full">在庫注意</span>
            <div id="low-stock-list" class="mt-3 text-sm text-slate-600">読み込み中...</div>
          </div>
        </div>
      </section>

      <section id="view-inventory" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold">おくすり在庫</h2>
          <button onclick="addMedicine()" class="bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md">+ 薬を追加</button>
        </div>
        <div id="medicine-cards" class="grid md:grid-cols-2 gap-4"></div>
      </section>

      <section id="view-condition" class="hidden space-y-6">
        <h2 class="text-xl font-bold">本日の体調管理</h2>
        <div class="bg-white border rounded-2xl p-6 shadow-sm space-y-4">
          <div>
            <label class="block text-xs font-bold mb-1">血圧 (朝/昼/晩)</label>
            <input type="text" id="bp-input" placeholder="120/80" class="w-full border p-2.5 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">プチ日記</label>
            <textarea id="diary-input" class="w-full border p-2.5 rounded-xl text-sm h-20"></textarea>
          </div>
          <button onclick="saveCondition()" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-xl text-sm">保存する</button>
        </div>
      </section>

    </main>
  </div>

  <script>
    // 1. Supabase 初期化 (設定値を置き換えてください)
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 認証処理
    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert('確認メールを送信しました。メールを確認してください。');
    }

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else checkSession();
    }

    async function handleSignOut() {
      await supabase.auth.signOut();
      checkSession();
    }

    // 画面状態チェック
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('flex');
        fetchMedicines();
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    }

    // タブ切り替え
    function switchTab(tabName) {
      ['dashboard', 'inventory', 'condition'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
      });
      document.getElementById(`view-${tabName}`).classList.remove('hidden');
    }

    // データ操作 (おくすり取得)
    async function fetchMedicines() {
      const { data: medicines } = await supabase.from('medicines').select('*');
      const container = document.getElementById('medicine-cards');
      const lowStockList = document.getElementById('low-stock-list');
      
      container.innerHTML = '';
      lowStockList.innerHTML = '';

      if (!medicines || medicines.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-400">登録された薬はありません。</p>';
        lowStockList.innerText = '該当する薬はありません。';
        return;
      }

      medicines.forEach(m => {
        container.innerHTML += `
          <div class="bg-white border rounded-2xl p-5 shadow-sm flex justify-between items-center">
            <div>
              <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md">${m.category || '未設定'}</span>
              <h3 class="font-bold text-slate-800 text-base mt-1">${m.name}</h3>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">在庫</span>
              <div class="text-lg font-bold">${m.stock} ${m.unit || '錠'}</div>
            </div>
          </div>
        `;

        if (m.stock <= 5) {
          lowStockList.innerHTML += `<p class="font-bold text-rose-600">・${m.name} (残り ${m.stock} ${m.unit || '錠'})</p>`;
        }
      });
    }

    // おくすり追加（テスト用簡易関数）
    async function addMedicine() {
      const name = prompt('薬の名前を入力してください:');
      if (!name) return;
      const { data: { user } } = await supabase.auth.getUser();
      await supabase.from('medicines').insert([{ name, stock: 10, user_id: user.id }]);
      fetchMedicines();
    }

    // 初期起動処理
    window.onload = () => {
      lucide.createIcons();
      checkSession();
    };
  </script>
</body>
</html>
