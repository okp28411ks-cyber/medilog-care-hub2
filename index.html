<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediLog Care Hub</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons (アイコンライブラリ) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ヘッダーナビゲーション -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <i data-lucide="activity" class="brand-icon"></i>
        <span class="brand-name">MediLog Care Hub</span>
      </div>
      <button id="openModalBtn" class="btn btn-primary">
        <i data-lucide="plus"></i> 新規記録を追加
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    <!-- ステータス概要（ダッシュボードカード） -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">総記録数</span>
          <i data-lucide="file-text" class="stat-icon"></i>
        </div>
        <div id="statTotal" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">本日の記録</span>
          <i data-lucide="calendar" class="stat-icon"></i>
        </div>
        <div id="statToday" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">要対応</span>
          <i data-lucide="alert-circle" class="stat-icon"></i>
        </div>
        <div id="statAttention" class="stat-value">0</div>
      </div>
    </section>

    <!-- 記録一覧セクション -->
    <section class="content-section">
      <div class="section-header">
        <h2>ケア記録一覧</h2>
        <button id="refreshBtn" class="btn btn-outline">
          <i data-lucide="rotate-cw"></i> 更新
        </button>
      </div>
      <div id="cardContainer" class="grid">
        <!-- JavaScript側でSupabaseから取得したカードが動的に挿入されます -->
        <p class="loading-text">データを読み込み中...</p>
      </div>
    </section>
  </main>

  <!-- 新規作成モーダル -->
  <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新規ケア記録の作成</h3>
        <button class="close-modal btn-icon">&times;</button>
      </div>
      <form id="mainForm">
        <div class="form-group">
          <label class="form-label" for="title">件名 / 利用者名</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="例: 山田 太郎様 - バイタルチェック" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="category">カテゴリー</label>
          <select id="category" name="category" class="form-control" required>
            <option value="バイタル">バイタル</option>
            <option value="食事・水分">食事・水分</option>
            <option value="服薬">服薬</option>
            <option value="経過観察">経過観察</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="notes">詳細メモ</label>
          <textarea id="notes" name="notes" class="form-control" rows="4" placeholder="体調や特記事項を入力してください" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline close-modal">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- アプリケーションスクリプト -->
  <script src="app.js"></script>
</body>
</html>
